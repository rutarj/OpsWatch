[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opswatch"
version = "1.0.0"
description = "AI-assisted IT service desk triage with an MCP server, human approval gates and a tamper-evident audit log."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.2,<3",
  "anthropic>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "httpx>=0.27",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
opswatch = "opswatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opswatch = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Data tables and regex patterns read better unwrapped.
"src/opswatch/seed.py" = ["E501"]
"src/opswatch/guardrails/injection.py" = ["E501"]
